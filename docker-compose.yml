services:
  openticket:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TOKEN: ${TOKEN:?Defina TOKEN em Environment Variables no Coolify}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HEZZUZ_DONATE_BRIDGE_TOKEN: ${HEZZUZ_DONATE_BRIDGE_TOKEN:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_TEST_ACCESS_TOKEN: ${MP_TEST_ACCESS_TOKEN:-}
      MP_TEST_WEBHOOK_SECRET: ${MP_TEST_WEBHOOK_SECRET:-}
    volumes:
      - hezzuz_data:/data
    healthcheck:
      disable: true
volumes:
  hezzuz_data:
